name: Create Release

# Manual entry point for a release. Computes the next version with
# git-cliff, pushes the tag, creates a *draft* GitHub release and dispatches
# release.yml on that tag. Nothing becomes public before the prod-environment
# approval in release.yml: the publish job uploads the artifacts, publishes
# to PyPI and only then takes the release out of draft.
#
# GITHUB_TOKEN-created releases and tag pushes do not trigger workflows;
# workflow_dispatch is the exception, hence the explicit dispatch.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tag, create draft release
      actions: write # dispatch release.yml
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are tagged from main (got ${GITHUB_REF})."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff needs the full history and tags

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Determine next version
        id: version
        run: |
          latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          tag=$(git-cliff --bumped-version 2>/dev/null)
          case "$tag" in v*|"") ;; *) tag="v$tag" ;; esac
          if [ -z "$tag" ] || [ "$tag" = "$latest" ]; then
            echo "No release needed (no relevant commits since ${latest:-the start})." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create tag and draft release
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          git-cliff --unreleased --tag "$TAG" --strip header > "$notes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$notes"
          {
            echo "## Draft release $TAG"
            echo
            cat "$notes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch release.yml
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Dispatched release.yml on $TAG — approve the prod deployment to publish." | tee -a "$GITHUB_STEP_SUMMARY"
