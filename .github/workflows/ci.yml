name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-check

      - name: Install prek
        uses: j178/prek-action@v3.0.0
        with:
          install-only: true

      - name: Run git hooks
        run: task prek

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Type-check
        run: task typecheck

  test:
    runs-on: ubuntu-latest
    needs: rust
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-core

      - name: Run tests
        run: task test-python

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-core

      - name: Lint
        run: task lint-rust

      - name: Test
        run: task test-rust

  android:
    runs-on: ubuntu-latest
    env:
      # Debug APK job: skip release-optimizing Rust and the emulator-only ABI.
      CS_RUST_PROFILE: debug
      CS_ABIS: arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-android
          # Profile/ABIs shape target/ contents; the key must reflect them or a
          # full-match restore blocks saving new artifacts forever.
          key: ${{ env.CS_RUST_PROFILE }}-${{ env.CS_ABIS }}

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Lint
        run: task android:lint

      - name: Test
        run: task android:test

      - name: Build debug APK
        run: task android:build
