name: Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cosw:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-core

      # Versions live in git tags, not committed manifests — stamp the
      # workspace checkout so the built wheel carries the release version.
      - name: Stamp version from tag
        run: |
          v="${{ github.event.release.tag_name }}"
          uv version --package cosw "${v#v}"
          uv version --package contextswitch-core "${v#v}"

      - name: Build distributions
        run: task cli:build

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosw-wheel
          path: dist/cosw-*.whl

      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     packages-dir: dist/

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-android
          key: release-arm64-v8a-x86_64

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Compute version from tag
        id: version
        run: |
          tag="${{ github.event.release.tag_name }}"
          v="${tag#v}"
          IFS=. read -r major minor patch <<< "$v"
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#${patch%%-*} ))" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: task android:release VERSION_NAME=${{ steps.version.outputs.name }} VERSION_CODE=${{ steps.version.outputs.code }}

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk \
             "contextswitch-${{ steps.version.outputs.name }}-unsigned.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: contextswitch-*-unsigned.apk

  publish:
    runs-on: ubuntu-latest
    needs: [cosw, android]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach artifacts to release
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/* --clobber
