name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build distributions
        run: uv run scripts/build-cosw-wheel.py

      # - name: Publish to PyPI
