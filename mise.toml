[settings]
# Never fall back to third-party asdf plugins (shell scripts cloned from git)
disable_backends = ["asdf"]
# 7-day release cooldown — resolves "latest" to a release at least 7 days old
minimum_release_age = "7d"

[tools]
uv = "latest"
task = "latest"
git-cliff = "latest"
prek = "latest"
gh = "latest"
cloc = "latest"
