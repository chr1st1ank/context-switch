[package]
name = "contextswitch-uniffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "contextswitch_uniffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
contextswitch-core = { path = "../contextswitch-core", default-features = false }
uniffi = { version = "0.29", features = ["cli"] }
chrono = "0.4"
thiserror = "2"
uuid = { version = "1.0", features = ["v4", "serde"] }
serde_json = "1.0"
