[package]
name = "contextswitch-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
pyo3 = { version = "0.25", features = [
    "chrono",
    "abi3-py310",
], optional = true }
thiserror = "2"
chacha20poly1305 = { version = "0.11", features = ["alloc"] }
argon2 = { version = "0.6", features = ["alloc"] }
getrandom = "0.2"
minreq = { version = "3", features = ["https"] }
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"

[features]
default = ["python"]
python = ["dep:pyo3"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[lib]
name = "contextswitch_core"
crate-type = ["cdylib", "rlib"]
