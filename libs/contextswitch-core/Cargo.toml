[package]
name = "contextswitch-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
pyo3 = { version = "0.22", features = ["chrono", "abi3-py310"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lib]
name = "contextswitch_core"
crate-type = ["cdylib"]

[[bin]]
name = "contextswitch-core"
path = "src/bin/main.rs"
