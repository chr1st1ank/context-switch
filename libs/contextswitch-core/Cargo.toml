[package]
name = "contextswitch-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
pyo3 = { version = "0.25", features = ["chrono", "abi3-py310"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[lib]
name = "contextswitch_core"
crate-type = ["cdylib", "rlib"]
