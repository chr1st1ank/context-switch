version: "3"

vars:
  # Gradle 8.10 doesn't run on JDK 26; prefer 21, then 17, then JAVA_HOME.
  JAVA:
    sh: for j in /usr/lib/jvm/java-21-openjdk /usr/lib/jvm/java-17-openjdk; do [ -d "$j" ] && echo "$j" && break; done
  SDK:
    sh: echo "${ANDROID_HOME:-/opt/android-sdk}"

env:
  JAVA_HOME: "{{.JAVA}}"
  ANDROID_HOME: "{{.SDK}}"

tasks:
  rust:
    desc: Build the Rust core for Android and generate Kotlin bindings
    cmds:
      - bash build-rust.sh

  build:
    desc: Build debug APK (runs rust task first)
    cmds:
      - ./gradlew assembleDebug

  install:
    desc: Build and install on a connected device via adb
    cmds:
      - ./gradlew installDebug

  preview:
    desc: Boot the emulator (creating the AVD if needed), install, and launch the app
    deps: [rust]
    vars:
      AVD: pixel7
      IMAGE: system-images;android-35;google_apis;x86_64
    cmds:
      - |
        set -euo pipefail
        ADB="{{.SDK}}/platform-tools/adb"
        EMULATOR="{{.SDK}}/emulator/emulator"
        AVDMANAGER="{{.SDK}}/cmdline-tools/latest/bin/avdmanager"

        if ! "$AVDMANAGER" list avd | grep -q "Name: {{.AVD}}"; then
          echo "no" | "$AVDMANAGER" create avd -n "{{.AVD}}" -k "{{.IMAGE}}" -d "pixel_7"
        fi

        if ! "$ADB" devices | grep -q "emulator-"; then
          "$EMULATOR" -avd "{{.AVD}}" -gpu swiftshader_indirect -memory 4096 >/dev/null 2>&1 &
          "$ADB" wait-for-device
          while [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; do sleep 2; done
        fi

        JAVA_HOME="{{.JAVA}}" ./gradlew installDebug
        "$ADB" shell am start -n dev.contextswitch/.MainActivity

  stop-preview:
    desc: Stop the emulator
    vars:
      AVD: pixel7
      IMAGE: system-images;android-35;google_apis;x86_64
    cmds:
      - |
        set -euo pipefail
        ADB="{{.SDK}}/platform-tools/adb"
        EMULATOR="{{.SDK}}/emulator/emulator"
        AVDMANAGER="{{.SDK}}/cmdline-tools/latest/bin/avdmanager"

        if "$AVDMANAGER" list avd | grep -q "Name: {{.AVD}}"; then
          "$ADB" shell reboot -p
        fi

  test:
    desc: Run unit tests
    cmds:
      - ./gradlew test

  lint:
    desc: Lint Kotlin/Gradle code
    cmds:
      - ./gradlew lint
