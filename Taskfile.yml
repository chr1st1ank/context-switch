version: "3"

includes:
  cli:
    taskfile: ./cli/Taskfile.yml
    dir: ./cli
  core:
    taskfile: ./libs/contextswitch-core/Taskfile.yml
    dir: ./libs/contextswitch-core
  android:
    taskfile: ./android/Taskfile.yml
    dir: ./android

tasks:
  lint:
    desc: Lint and format everything
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .
      - task: lint-rust

  lint-rust:
    desc: Check formatting and lint the Cargo workspace
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  prek:
    desc: Run the git hooks against all files (what CI's lint job runs)
    cmds:
      - prek run --all-files

  typecheck:
    desc: Type-check everything
    cmds:
      - uv run ty check

  test-python:
    desc: Run Python tests only (builds the core library bindings first)
    cmds:
      - task: core:develop
      - uv run pytest

  test:
    desc: Run all test suites
    cmds:
      - task: test-python
      - task: test-rust

  test-rust:
    desc: Run the Cargo workspace tests
    cmds:
      - cargo test --workspace --all-features --locked

  check:
    desc: Everything that CI checks
    cmds:
      - task: lint
      - task: typecheck
      - task: test

  update-dependencies:
    desc: Upgrade every lock file and hook revision (7-day cooldown)
    cmds:
      - mise upgrade
      - uv lock --upgrade
      - uv sync
      - cargo update # no cooldown on stable cargo yet
      - prek update
      - task: check

  stats:
    desc: Show lines-of-code statistics
    cmds:
      - cloc --vcs=git --quiet --hide-rate . | tail -n +2

  changelog:
    desc: Preview unreleased changelog
    cmds:
      - git-cliff --unreleased

  release:
    desc: Trigger the Create Release workflow on main (humans only — pushes a tag; publishing still needs prod approval)
    cmds:
      - gh workflow run create-release.yml --ref main
      - echo "Dispatched — follow it with 'gh run watch' or on the Actions tab."
