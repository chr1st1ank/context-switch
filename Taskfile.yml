version: "3"

includes:
  cli:
    taskfile: ./cli/Taskfile.yml
    dir: ./cli
  core:
    taskfile: ./libs/contextswitch-core/Taskfile.yml
    dir: ./libs/contextswitch-core
  android:
    taskfile: ./android/Taskfile.yml
    dir: ./android

tasks:
  lint:
    desc: Lint and format everything
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  pre-commit:
    desc: Run pre-commit hooks against all files (what CI's lint job runs)
    cmds:
      - uv run pre-commit run --all-files

  typecheck:
    desc: Type-check everything
    cmds:
      - uv run ty check

  test-python:
    desc: Run Python tests only (builds the core library bindings first)
    cmds:
      - task: core:develop
      - uv run pytest

  test:
    desc: Run all test suites
    cmds:
      - task: test-python
      - task: core:test

  check:
    desc: Everything that CI checks
    cmds:
      - task: lint
      - task: typecheck
      - task: test

  docs:
    desc: Build documentation
    cmds:
      - echo "Documentation building not yet configured"

  docs-serve:
    desc: Serve documentation locally
    cmds:
      - echo "Documentation serving not yet configured"

  stats:
    desc: Show lines-of-code statistics
    cmds:
      - cloc --vcs=git --quiet --hide-rate . | tail -n +2

  changelog:
    desc: Preview unreleased changelog
    cmds:
      - git-cliff --unreleased

  draft-release:
    desc: Determine next version and create a draft GitHub release (humans only — pushes a tag)
    interactive: true
    cmd: |
      set -e
      if [ "$(git branch --show-current)" != "main" ]; then
        echo "Not on main — releases are tagged from main."
        exit 1
      fi
      if [ -n "$(git status --porcelain)" ]; then
        echo "Working tree is not clean."
        exit 1
      fi
      LATEST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
      TAG=$(git-cliff --bumped-version 2>/dev/null)
      if [ -z "$TAG" ]; then
        echo "No release needed (no relevant commits since last tag)."
        exit 0
      fi
      case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
      if [ "$TAG" = "$LATEST" ]; then
        echo "No release needed (no relevant commits since last tag)."
        exit 0
      fi
      NOTES=$(git-cliff --unreleased --tag "$TAG" --strip header 2>/dev/null)
      echo ""
      echo "Next version: $TAG"
      echo ""
      echo "$NOTES"
      echo ""
      read -p "Create draft release for $TAG? [y/N] " confirm
      if [ "$confirm" != "y" ] && [ "$confirm" != "Y" ]; then
        echo "Aborted."
        exit 1
      fi
      git tag -a "$TAG" -m "$TAG"
      git push origin tag "$TAG"
      gh release create "$TAG" --draft --title "$TAG" --notes "$NOTES"
      echo ""
      echo "Draft release created for $TAG"
