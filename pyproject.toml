[project]
name = "context-switch"
version = "0.0.0"
description = "Multi-device time tracking with synchronized storage"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = ["cli", "libs/*"]

[dependency-groups]
dev = ["pre-commit", "ruff", "ty", "pytest", "pytest-cov", "maturin>=1.0,<2.0"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["cli/tests", "libs/*/tests"]
addopts = "--cov=cli --cov=libs --cov-report=term-missing --cov-fail-under=95"
