[project]
name = "cosw"
version = "0.1.0"
description = "context-switch CLI client for time tracking"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
]

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cosw"]
